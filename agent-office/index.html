<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Office</title>
<style>
:root{
  --page:#e7e9f4; --card:#ffffff; --ink:#262a3f; --sub:#767b95; --faint:#a7abc0; --line:#e4e6f0;
  --indigo:#3d4291; --indigo-soft:#eceefb; --lit:#ffc94d; --claude:#e2733f; --live:#2f9e66;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page);color:var(--ink);
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:13px}
button{font:inherit;color:inherit}
.jua{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:700;letter-spacing:-.01em}
#app{display:grid;grid-template-columns:1fr 290px;gap:14px;height:100vh;padding:14px}

/* 처음 설정 창 */
#setupBg{position:fixed;inset:0;background:rgba(38,42,63,.38);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
#setupBg.open{display:flex}
#setup{background:var(--card);border-radius:20px;box-shadow:0 18px 50px rgba(40,40,90,.3);width:min(460px,100%);max-height:100%;overflow:auto;padding:22px 22px 18px}
#setup h3{margin:0 0 4px;font-size:22px;font-weight:700;color:var(--indigo)}
#setup .lead{margin:0 0 14px;color:var(--sub);font-size:12.5px;line-height:1.6}
#setup label.f{display:block;margin:12px 0 0;font-size:12.5px;font-weight:600}
#setup label.f small{display:block;font-weight:400;color:var(--sub);margin:2px 0 6px}
#setup input[type=text]{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--ink);background:#fff}
#setup input[type=text]:focus{outline:2px solid var(--indigo);outline-offset:-1px}
#setup .ck{display:flex;gap:8px;align-items:flex-start;margin:14px 0 0;font-size:12.5px;cursor:pointer}
#setup .ck input{margin-top:3px}
#setup .ck small{display:block;color:var(--sub)}
#setup .found{margin:14px 0 0;padding:10px 12px;background:#f6f7fc;border-radius:10px;font-size:12px;line-height:1.7;color:#4b5068}
#setup .note{font-size:12px;color:var(--sub);margin:12px 0 0;line-height:1.6}
#setup .msg{color:#d4483b;font-size:12px;min-height:16px;margin:10px 0 0}
#setup footer{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
#setup .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-size:13px;cursor:pointer}
#setup .btn.pri{background:var(--indigo);border-color:var(--indigo);color:#fff}

/* ── 가운데: 디오라마 ── */
#center{position:relative;overflow:hidden;border-radius:22px;
  background:
    radial-gradient(120px 40px at 18% 18%,rgba(255,255,255,.85),transparent 70%),
    radial-gradient(160px 46px at 78% 12%,rgba(255,255,255,.75),transparent 70%),
    radial-gradient(130px 36px at 88% 64%,rgba(255,255,255,.6),transparent 70%),
    linear-gradient(180deg,#c8dcff 0%,#e3e2fb 52%,#fbe3d8 100%)}
/* 밤 모드 — 남색 하늘 · 별 · 달 */
#center.night{background:
    radial-gradient(28px 28px at 84% 14%,#fff6d8 0 45%,rgba(255,240,190,.35) 55%,transparent 72%),
    radial-gradient(1.5px 1.5px at 12% 20%,#fff 99%,transparent),radial-gradient(1px 1px at 22% 8%,#fff 99%,transparent),
    radial-gradient(1.5px 1.5px at 35% 15%,#fff 99%,transparent),radial-gradient(1px 1px at 48% 6%,#fff 99%,transparent),
    radial-gradient(1.5px 1.5px at 60% 22%,#fff 99%,transparent),radial-gradient(1px 1px at 70% 9%,#fff 99%,transparent),
    radial-gradient(1px 1px at 93% 30%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 6% 42%,#fff 99%,transparent),
    radial-gradient(1px 1px at 95% 52%,#fff 99%,transparent),radial-gradient(1px 1px at 4% 70%,#fff 99%,transparent),
    linear-gradient(180deg,#1b1f4a 0%,#2c2f6b 55%,#4a3f78 100%)}
#cv{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
#cv.drag{cursor:grabbing}
#ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#head{position:absolute;left:16px;top:16px;right:16px;display:flex;align-items:flex-start;gap:10px;pointer-events:none}
#title{pointer-events:auto;background:rgba(255,255,255,.92);border-radius:14px;padding:9px 12px 9px 14px;display:flex;align-items:center;gap:12px;
  box-shadow:0 6px 20px rgba(60,60,110,.10);max-width:min(520px,70%)}
#title .tx{min-width:0}
#title .tx b{display:block;font-size:15px;font-weight:700}
#title .tx span{display:block;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 가리기 모드 — 캡처용: 이름 · 층/세션 이름 · 작업 내용을 흐리게 */
/* 사용량 — 항상 오른쪽 위 */
#usage{margin-left:auto;pointer-events:auto;background:rgba(255,255,255,.92);border-radius:12px;padding:6px 10px;display:grid;grid-template-columns:auto auto auto;gap:3px 8px;align-items:center;font-size:11px;color:var(--sub);box-shadow:0 6px 20px rgba(60,60,110,.10)}
#usage:empty{display:none}
#usage .who{font-weight:700;font-size:10.5px}
#usage .who.cl{color:#c8642f}#usage .who.cx{color:#0e7c66}
#usage .w{display:flex;align-items:center;gap:5px;white-space:nowrap}
#usage .bar{width:42px;height:6px;border-radius:3px;background:#e6e8f3;overflow:hidden}
#usage .bar i{display:block;height:100%;border-radius:3px}
#usage .na{grid-column:2/4;color:var(--faint)}
#usage:not(:empty)+#live{margin-left:0}
#live{margin-left:auto;pointer-events:auto;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--sub);background:rgba(255,255,255,.92);border-radius:999px;padding:6px 11px}
#live b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--sub);padding-left:8px;margin-left:2px;border-left:1px solid #dfe2ee}
#live i{width:7px;height:7px;border-radius:50%;background:#c3c6d6}
#live.ok{color:var(--live)}
#live.ok i{background:var(--live);animation:breathe 2s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 4px rgba(47,158,102,.18)}}
#tools{position:absolute;right:16px;top:64px;display:flex;flex-direction:column;gap:6px}
#tools button{width:34px;height:34px;border:0;border-radius:10px;background:rgba(255,255,255,.92);cursor:pointer;font-size:15px;color:#555a74;box-shadow:0 3px 10px rgba(60,60,110,.08)}
#tools button:hover{background:#fff}
#tools button:focus-visible{outline:2px solid var(--indigo)}
#empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:var(--sub);line-height:1.8}
#center.fade #cv,#center.fade #ov{opacity:.1;transition:opacity .2s}

/* 간판·이름표·말풍선 */
.nm{position:absolute;transform:translate(-50%,0);transform-origin:50% 0;white-space:nowrap;font-size:11px;font-weight:600;
  background:#fff;border-radius:7px;padding:2px 7px;box-shadow:0 2px 0 rgba(40,40,80,.12);max-width:190px;overflow:hidden;text-overflow:ellipsis;border-bottom:2px solid}
.nm em{font-style:normal;font-weight:500;color:var(--sub)}
.bub{position:absolute;transform:translate(-50%,-100%);background:#fff;border-radius:14px;padding:7px 11px;font-size:12px;line-height:1.45;
  width:max-content;max-width:230px;box-shadow:0 6px 18px rgba(50,50,100,.14);animation:pop .2s cubic-bezier(.3,1.6,.5,1)}
.bub::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:inherit}
.bub{border-top-color:#fff}
.bub .k{display:block;font-size:11px;font-weight:600;color:var(--sub)}
.bub.think{background:#f3f0ff;border-top-color:#f3f0ff;border-radius:18px}
.bub.think::after{border:0;width:9px;height:9px;border-radius:50%;background:#f3f0ff;bottom:-12px;margin-left:-14px}
.bub.think .k{color:#6a4fc4}
.bub.error{background:#fff0ed;border-top-color:#fff0ed}
.bub.error .k{color:#c63f2b}
.bub.report{background:#e9f8ef;border-top-color:#e9f8ef}
.bub.report .k{color:#26855a}
.bub.user{background:#fff6dc;border-top-color:#fff6dc}
@keyframes pop{from{opacity:0;transform:translate(-50%,-80%) scale(.85)}}

/* ── 오른쪽: 업무 일지 ── */
#right{background:var(--card);border-radius:22px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
#jhead{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
#jhead h2{margin:0 0 8px;font-size:19px;color:var(--indigo)}
#alog{flex:1;overflow:auto;padding:12px 16px 16px 14px;position:relative}
.al{position:relative;padding:0 0 14px 22px}
.al::before{content:"";position:absolute;left:5px;top:12px;bottom:0;width:2px;background:#eceef6}
.al:last-child::before{display:none}
.al i{position:absolute;left:0;top:3px;width:12px;height:12px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #e1e3ee}
.al .h{display:flex;gap:6px;align-items:baseline}
.al .h b{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al .h time{margin-left:auto;font-size:10.5px;color:var(--faint);flex:none}
.al p{margin:2px 0 0;font-size:12px;color:#5a5f78;line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
#alog .none{color:var(--faint);font-size:12px;padding:8px 0}
/* room labels — each project has its own colour (--c) */
.olab{--c:#c3c6d6;position:absolute;transform:translate(-50%,-100%);transform-origin:50% 100%;pointer-events:auto;cursor:pointer;white-space:nowrap;
  background:rgba(255,255,255,.95);border-radius:12px;padding:5px 12px 6px;box-shadow:0 4px 14px rgba(60,60,110,.18);
  display:flex;flex-direction:column;gap:1px;font-size:11px;color:var(--sub);border:2px solid var(--c);border-bottom-width:4px;max-width:300px}
.olab:hover{background:#fff}
.olab b{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:700;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:6px}
.olab.main b{font-size:17px}
.olab b::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.olab.on b::before{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent);animation:breathe 2s ease-in-out infinite}
.olab.ask{animation:flAsk 1s ease-in-out infinite}
.olab.err{animation:flErr 1s ease-in-out infinite}
.olab .tag{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:10px;font-weight:700;border-radius:5px;padding:1px 5px;background:#ffb347;color:#4a2a00}
.olab.err .tag{background:#ff6b5b;color:#fff}
.olab .p{display:flex;align-items:center;gap:5px;color:#4b5068}
.olab .p img{width:22px;height:22px;border-radius:7px;background:#f1f2f9;flex:none;image-rendering:pixelated}
.olab .p strong{font-family:inherit;font-size:11.5px;font-weight:600;color:var(--ink)}
.olab .p.codex strong{color:#0e7c66}.olab .p.claude strong{color:#c8642f}
.olab .p .st{font-size:10.5px;color:var(--sub)}
.olab .p em{font-style:normal;color:var(--faint);overflow:hidden;text-overflow:ellipsis;max-width:170px}
.olab small{font-size:10.5px;color:var(--faint)}
.olab.sm{padding:3px 9px 4px;max-width:200px}
.olab.sm b{font-size:13px}
.olab.sm .p em{display:none}
.olab.lng{--c:#b07a4a}
@keyframes flAsk{50%{box-shadow:0 0 0 3px #ffb347,0 0 14px #ffb347}}
@keyframes flErr{50%{box-shadow:0 0 0 3px #ff6b5b,0 0 14px #ff6b5b}}
.bub{transform-origin:50% 100%}
body.priv :is(.olab>b,.olab .p em,#tname,#tsub,.al b,.al p,.bub,.nm,.sign){filter:blur(5px)}
#privBtn.on{outline:2px solid #ffb347}
@media (max-width:1000px){#app{grid-template-columns:1fr}#right{display:none}}
@media (prefers-reduced-motion:reduce){.bub{animation:none}#live.ok i{animation:none}.olab.ask,.olab.err{animation:none}}
.olab.mini .p,.olab.mini small{display:none}
.olab.front{transform:translate(-50%,0);transform-origin:50% 0}
</style>

  for (const S of ORDER) { if (S.main) { lamp(S, 4, 3.5, 'library'); lamp(S, 11.5, 3.5, 'dev'); } else lamp(S, 11.5, 3.5, 'dev'); }
  lamp(LOUNGE, 4.5, 3.5, 'lounge');
  ctx.restore();
}
function applyNight() {

}

function connect() {
